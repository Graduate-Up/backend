# Render Blueprint: main 브랜치에 푸시하면 자동으로 다시 배포된다.
# 무료 플랜은 디스크가 유지되지 않아 재배포·재시작 때 계정/이수내역 SQLite가 초기화된다.
services:
  - type: web
    name: jolup-backend
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # Render가 HTTPS를 앞단에서 처리하므로 X-Forwarded-Proto를 믿어야
    # 로그인 쿠키(secure)와 같은 출처 검사가 https 기준으로 동작한다.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: JOLUP_DB_PATH
        value: /tmp/jolup/accounts.sqlite3
      - key: JOLUP_EMAIL_TRANSPORT
        value: brevo
      - key: JOLUP_BREVO_API_KEY
        sync: false
      - key: JOLUP_BREVO_FROM
        sync: false
      - key: JOLUP_EMAIL_CODE_SECRET
        sync: false
      # 프런트 배포 주소(Vercel)와 개발 서버 주소. 프런트 주소가 바뀌면 쉼표로 추가한다.
      - key: JOLUP_FRONTEND_ORIGINS
        value: https://frontend-xi-indol-43.vercel.app,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
