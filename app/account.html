<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 학생 설정 | 졸UP</title>
  <style>
    body { margin: 3rem auto; padding: 0 1rem; max-width: 38rem; font: 1rem/1.6 system-ui, sans-serif; color: #202632; }
    form { display: grid; gap: .8rem; }
    label { display: grid; gap: .25rem; }
    [hidden] { display: none; }
    input, select, button { font: inherit; padding: .45rem .65rem; }
    button { cursor: pointer; }
    section { border: 1px solid #d4d4d8; border-radius: .6rem; padding: 1rem; }
    h2 { margin: 0 0 .7rem; }
    #status { min-height: 1.6em; }
    #my-requirements section, #my-requirements details { margin: .8rem 0; }
    #my-requirements summary { cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>내 학생 설정</h1>
    <section id="sign-in">
      <h2>로그인</h2>
      <form id="credentials" method="post">
        <label>아이디
          <input name="username" required autocomplete="username" minlength="3" maxlength="64"
                 aria-describedby="username-hint">
          <small id="username-hint">영문 또는 숫자로 시작하고, 영문·숫자·밑줄·점·하이픈을 사용해 3~64자로 입력하세요.</small>
        </label>
        <label>비밀번호
          <input name="password" type="password" required autocomplete="current-password" minlength="8" maxlength="128"
                 aria-describedby="password-hint">
          <small id="password-hint">8~128자로 입력하세요.</small>
        </label>
        <div><button type="submit" value="login">로그인</button> <button type="submit" value="register">계정 만들기</button></div>
      </form>
    </section>
    <section id="settings" hidden>
      <h2 id="account-title"></h2>
      <form id="profile">
        <label>학번 <input name="student_number" required inputmode="numeric" pattern="[0-9]+" maxlength="32"></label>
        <label>입학년도 <select name="admission_year" required></select></label>
        <label>전공 <select name="major" required></select></label>
        <label id="track-label" hidden>졸업 트랙 <select name="track"></select></label>
        <label id="variant-label" hidden>트랙 세부 유형 <select name="track_variant"></select></label>
        <label id="abeek-label" hidden>ABEEK <select name="abeek">
          <option value="">선택</option><option value="false">미이수</option><option value="true">이수</option>
        </select></label>
        <label>학생 구분 <select name="student_status">
          <option value="new">신입학</option><option value="general_transfer">일반편입</option>
          <option value="bachelor_transfer">학사편입</option><option value="foreign">외국인</option>
          <option value="disabled">등록 장애학생</option>
        </select></label>
        <label>다전공 <select name="multi_major">
          <option value="none">단일전공</option><option value="double_or_linked_or_convergence">복수·연계·융합전공</option>
          <option value="minor_1_only">부전공 1개</option><option value="minor_2plus">부전공 2개 이상</option>
          <option value="teaching_course">교직이수</option>
        </select></label>
        <fieldset>
          <legend>졸업 예정 연·월 (선택)</legend>
          <label>연도 <select name="graduation_year"><option value="">미선택</option></select></label>
          <label>월 <select name="graduation_month"><option value="02">2월</option><option value="08">8월</option></select></label>
        </fieldset>
        <div><button type="submit">설정 확인 및 저장</button> <button type="button" id="logout">로그아웃</button></div>
      </form>
      <p id="saved-settings" hidden></p>
      <button type="button" id="show-requirements" hidden>내 졸업요건 조회</button>
    </section>
    <p id="status" role="status"></p>
    <article id="my-requirements" aria-labelledby="result-title" hidden></article>
    <p><a href="/requirements">다른 조건으로 조회</a> · <a href="/docs">API 문서</a></p>
  </main>
  <script>
    const credentials = document.querySelector("#credentials");
    const profile = document.querySelector("#profile");
    const fields = profile.elements;
    const signIn = document.querySelector("#sign-in");
    const settings = document.querySelector("#settings");
    const status = document.querySelector("#status");
    const saved = document.querySelector("#saved-settings");
    const showRequirements = document.querySelector("#show-requirements");
    const requirementResult = document.querySelector("#my-requirements");
    const trackLabel = document.querySelector("#track-label");
    const variantLabel = document.querySelector("#variant-label");
    const abeekLabel = document.querySelector("#abeek-label");
    let token;
    let variants = {};
    let savedQuery;

    for (let year = 2026; year >= 2017; year--) fields.admission_year.add(new Option(year, year));
    for (let year = 2017; year <= 2200; year++) fields.graduation_year.add(new Option(year, year));

    function errorMessage(detail) {
      if (typeof detail === "string") return detail;
      if (!Array.isArray(detail)) return "요청을 처리하지 못했습니다.";
      const messages = {
        username: "사용자 이름은 영문 또는 숫자로 시작하는 3~64자여야 합니다. 한글과 공백은 사용할 수 없습니다.",
        password: "비밀번호를 8~128자로 입력해 주세요.",
        student_number: "학번을 숫자로 입력해 주세요.",
        major: "전공을 선택해 주세요.",
        expected_graduation_date: "졸업 예정 연도와 2월 또는 8월을 선택해 주세요.",
      };
      return [...new Set(detail.map(item => messages[item.loc?.at(-1)] || "입력값을 확인해 주세요."))].join(" ");
    }

    async function api(path, method = "GET", body) {
      const headers = {};
      if (token) headers.Authorization = "Bearer " + token;
      if (body) headers["Content-Type"] = "application/json";
      const response = await fetch("/api/v1" + path, {method, headers, body: body ? JSON.stringify(body) : undefined});
      if (response.status === 204) return;
      const data = await response.json();
      if (!response.ok) {
        if (response.status === 401 && token) {
          token = undefined;
          showSaved(null);
          settings.hidden = true;
          signIn.hidden = false;
        }
        throw new Error(errorMessage(data.detail));
      }
      return data;
    }

    function loadVariants(selected = "") {
      fields.track_variant.replaceChildren(new Option("일반", ""));
      const options = Object.entries(variants[fields.track.value] || {});
      for (const [value, label] of options) fields.track_variant.add(new Option(label, value));
      variantLabel.hidden = !options.length;
      fields.track_variant.value = selected;
    }

    async function loadTracks(original = {}) {
      variants = {};
      fields.track.replaceChildren(new Option("선택", ""));
      fields.abeek.value = "";
      trackLabel.hidden = true;
      abeekLabel.hidden = true;
      loadVariants();
      if (!fields.major.value) return;
      const query = new URLSearchParams({admission_year: fields.admission_year.value, major: fields.major.value});
      const options = await api("/requirements/tracks?" + query);
      if (options.allows_no_track) fields.track.options[0].text = "트랙 없음";
      for (const value of options.tracks) fields.track.add(new Option(options.track_labels[value] || value, value));
      trackLabel.hidden = !options.tracks.length;
      abeekLabel.hidden = !options.requires_abeek;
      fields.track.value = original.track || "";
      fields.abeek.value = original.abeek == null ? "" : String(original.abeek);
      variants = options.track_variants;
      loadVariants(original.track_variant || "");
    }

    async function loadMajors(original = {}) {
      const query = new URLSearchParams({admission_year: fields.admission_year.value});
      const {majors} = await api("/majors?" + query);
      fields.major.replaceChildren(new Option("선택", ""));
      for (const item of majors) fields.major.add(new Option(item.name, item.code));
      if (original.major) fields.major.value = original.major;
      await loadTracks(original);
    }

    function showSaved(data) {
      saved.hidden = !data;
      showRequirements.hidden = !data;
      requirementResult.hidden = true;
      requirementResult.replaceChildren();
      savedQuery = null;
      if (!data) return;
      const majorName = [...fields.major.options].find(option => option.value === data.major)?.text || data.major;
      const trackName = data.track
        ? [...fields.track.options].find(option => option.value === data.track)?.text || data.track : null;
      savedQuery = {admissionYear: data.admission_year, majorName, term: data.expected_graduation_date, trackName};
      const values = [data.student_number, data.admission_year + "학번", majorName];
      if (trackName) values.push(trackName);
      if (data.expected_graduation_date) values.push(data.expected_graduation_date + " 졸업 예정");
      saved.textContent = "저장된 설정 · " + values.join(" · ");
    }

    async function run(action) {
      status.textContent = "";
      const controls = [...document.querySelectorAll("button, select, input")];
      controls.forEach(control => control.disabled = true);
      try {
        await action();
      } catch (error) {
        status.textContent = error.message;
      } finally {
        controls.forEach(control => control.disabled = false);
      }
    }

    credentials.addEventListener("submit", event => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(credentials));
      const mode = event.submitter?.value || "login";
      run(async () => {
        if (mode === "register") {
          await api("/auth/register", "POST", data);
          status.textContent = "계정을 만들었습니다. 로그인해 주세요.";
          return;
        }
        const session = await api("/auth/login", "POST", data);
        token = session.access_token;
        const me = await api("/me");
        const stored = me.profile || {};
        profile.reset();
        for (const key of ["student_number", "admission_year", "student_status", "multi_major"]) {
          if (stored[key] != null) fields[key].value = stored[key];
        }
        if (stored.expected_graduation_date) {
          const [year, month] = stored.expected_graduation_date.split("-");
          fields.graduation_year.value = year;
          fields.graduation_month.value = month;
        }
        if (!stored.student_status && stored.international_student) fields.student_status.value = "foreign";
        if (!stored.student_status && stored.disabled_student) fields.student_status.value = "disabled";
        document.querySelector("#account-title").textContent = me.account.username + "님의 학생 설정";
        signIn.hidden = true;
        settings.hidden = false;
        credentials.elements.password.value = "";
        showSaved(me.profile);
        await loadMajors(stored);
        showSaved(me.profile);
      });
    });

    fields.admission_year.addEventListener("change", () => run(loadMajors));
    fields.major.addEventListener("change", () => run(loadTracks));
    fields.track.addEventListener("change", () => loadVariants());

    showRequirements.addEventListener("click", () => run(async () => {
      if (!savedQuery) return;
      requirementResult.hidden = true;
      const { renderRequirements } = await import("/requirements-view.js").catch(() => {
        throw new Error("졸업요건 화면을 불러올 수 없습니다. 8002번 서버를 재시작한 뒤 다시 로그인해 주세요.");
      });
      const requirements = await api("/me/requirements");
      renderRequirements(requirementResult, requirements, savedQuery);
      requirementResult.scrollIntoView({block: "start"});
    }));

    profile.addEventListener("submit", event => {
      event.preventDefault();
      const body = {
        student_number: fields.student_number.value,
        admission_year: Number(fields.admission_year.value),
        major: fields.major.value,
        track: fields.track.value || null,
        track_variant: fields.track_variant.value || null,
        abeek: fields.abeek.value ? fields.abeek.value === "true" : null,
        student_status: fields.student_status.value,
        multi_major: fields.multi_major.value,
        expected_graduation_date: fields.graduation_year.value
          ? fields.graduation_year.value + "-" + fields.graduation_month.value : null,
      };
      run(async () => {
        const me = await api("/me/profile", "PUT", body);
        showSaved(me.profile);
        status.textContent = "학생 설정을 저장했습니다.";
      });
    });

    document.querySelector("#logout").addEventListener("click", () => run(async () => {
      await api("/auth/logout", "POST");
      token = undefined;
      showSaved(null);
      settings.hidden = true;
      signIn.hidden = false;
      status.textContent = "로그아웃했습니다.";
    }));
  </script>
</body>
</html>
